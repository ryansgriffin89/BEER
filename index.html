<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Billy Bob’s Beer Tracker</title>

  <style>
    :root{
      --radius: 22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glass: rgba(0,0,0,.35);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.72);
      --gold: #f7c948;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color: var(--text);
      background: #0b0d10;
      overflow-x:hidden;
    }

    /* Background image (Billy Bob’s vibe) */
    .bg{
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.72)),
        url("assets/img/Background.png");
      background-size: cover;
      background-position: center;
      filter: saturate(1.1) contrast(1.05);
      transform: scale(1.02);
      z-index: -2;
    }
    /* subtle vignette */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.65) 85%);
      pointer-events:none;
    }

    .wrap{
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      padding: 14px 14px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(0,0,0,.35);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .title h1{
      margin:0;
      font-size: 18px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }
    .title p{
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .countBox{ text-align:right; min-width: 110px; }
    #count{
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,201,72,.9));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .countLabel{
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stage{
      position: relative;
      margin-top: 16px;
      height: 620px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* bar-floor fade */
    .stage::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 44%;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.62));
      pointer-events:none;
    }

    /* Mug button */
    #mugBtn{
      position:absolute;
      left: 16px;
      top: 16px;
      width: 175px;
      height: 175px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform-origin: 50% 70%;
    }
    #mugBtn img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 18px rgba(0,0,0,.6));
    }
    #mugBtn:active{ transform: scale(.98) translateY(2px); }

    .tapHint{
      position:absolute;
      left:50%;
      bottom: 10px;
      transform: translateX(-50%);
      font-size:12px;
      font-weight: 900;
      letter-spacing: 2px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.38);
      border: 1px solid rgba(255,255,255,.16);
      padding: 6px 10px;
      border-radius: 999px;
    }

    /* Trash can anchor */
    .trashcan{
      position:absolute;
      right: 14px;
      bottom: 10px;
      width: 145px;
      filter: drop-shadow(0 20px 18px rgba(0,0,0,.65));
      pointer-events:none;
      z-index: 2;
    }

    /* animation layer */
    #animLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index: 3;
    }

    /* thrown bottle image */
    .throwBottle{
      position:absolute;
      width: 48px;
      left: 118px;
      top: 152px;
      animation: throwBottle 0.9s cubic-bezier(.2,.8,.2,1) forwards;
      filter: drop-shadow(0 14px 12px rgba(0,0,0,.55));
    }
    @keyframes throwBottle{
      0%{ transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
      60%{ transform: translate(360px,-165px) rotate(160deg); }
      100%{ transform: translate(520px,120px) rotate(260deg); opacity:0; }
    }

    /* Beer pile */
    #beerPile{
      position:absolute;
      left: 14px;
      bottom: 12px;
      width: calc(100% - 200px);
      display:grid;
      grid-template-columns: repeat(auto-fill, 46px);
      gap: 6px;
      z-index: 1;
    }
    .beerIcon{
      width: 42px;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.45));
      animation: popIn .25s ease-out;
    }
    @keyframes popIn{
      from{ transform: scale(.6); opacity:0; }
      to{ transform: scale(1); opacity:1; }
    }

    /* Overlays */
    .overlay.hidden{ display:none; }
    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.78);
      z-index: 9999;
      padding: 16px;
    }
    .overlayGif{
      width: min(520px, 92vw);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
    }
    .overlayText{
      margin-top: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.95);
      text-shadow: 0 10px 34px rgba(0,0,0,.65);
    }

    /* small note box */
    .note{
      position:absolute;
      right: 16px;
      top: 16px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.85);
      font-size: 12px;
      max-width: 220px;
      backdrop-filter: blur(6px);
    }

    @media (max-width:520px){
      .stage{ height: 650px; }
      #mugBtn{ width: 160px; height: 160px; }
      .trashcan{ width: 135px; }
      .note{ max-width: 180px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <!-- Startup overlay (SC-Smile + intro audio) -->
  <div id="startupOverlay" class="overlay hidden">
    <img src="assets/img/SC-Smile.gif" alt="Stone Cold Smile" class="overlayGif">
    <div class="overlayText">WELCOME TO BILLY BOB’S</div>
  </div>

  <!-- Milestone overlay (every 5 beers alternates gifs) -->
  <div id="milestoneOverlay" class="overlay hidden">
    <img id="milestoneGif" src="" alt="Milestone" class="overlayGif">
  </div>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Billy Bob’s Beer Tracker</h1>
        <p>Tap the mug. Toss the bottle. Stack the beers.</p>
      </div>
      <div class="countBox">
        <div id="count">0</div>
        <div class="countLabel">beers</div>
      </div>
    </header>

    <main class="stage" id="stage">
      <button id="mugBtn" aria-label="Add beer">
        <img src="assets/img/Mug.png" alt="Beer Mug">
        <span class="tapHint">TAP</span>
      </button>

      <div class="note">
        If intro audio doesn’t play on load, tap once to unlock sound (Android thing).
      </div>

      <img class="trashcan" src="assets/img/Trash-can.png" alt="Trash can">

      <div id="animLayer"></div>
      <div id="beerPile"></div>
    </main>
  </div>

  <script>
    // ====== Elements
    const countEl = document.getElementById("count");
    const mugBtn = document.getElementById("mugBtn");
    const beerPile = document.getElementById("beerPile");
    const animLayer = document.getElementById("animLayer");

    const startupOverlay = document.getElementById("startupOverlay");
    const milestoneOverlay = document.getElementById("milestoneOverlay");
    const milestoneGif = document.getElementById("milestoneGif");

    // ====== State
    let beerCount = 0;
    let milestoneToggle = 0;
    let tapSoundIndex = 0;
    let introHasPlayed = false;

    // ====== Intro audio (excluded from rotation)
    const introAudio = new Audio("assets/audio/stone-cold-drink-beer.mp3");
    introAudio.volume = 0.9;

    // ====== Tap sound rotation (NO intro sound in here)
    const tapSounds = [
      "assets/audio/Bell.mp3",
      "assets/audio/Merica.mp3",
      "assets/audio/SCSA Theme.mp3",
      "assets/audio/Unbelievable.mp3",
      "assets/audio/What.mp3",
      "assets/audio/and-his-name-is-john-cena-1.mp3",
      "assets/audio/beer-bottle-clinks.mp3", // trimmed to 1.3s
      "assets/audio/gay.mp3",
      "assets/audio/kill-tony-meow.mp3",
      "assets/audio/kill-tony-song.mp3",
      "assets/audio/miller-time.mp3"
    ];

    function playIntroOnce() {
      if (introHasPlayed) return;
      introHasPlayed = true;

      startupOverlay.classList.remove("hidden");

      introAudio.currentTime = 0;
      introAudio.play().catch(() => {
        // Autoplay may be blocked until first tap
      });

      // hide overlay after a short burst
      setTimeout(() => {
        startupOverlay.classList.add("hidden");
      }, 2200);
    }

    function playNextTapSound() {
      const src = tapSounds[tapSoundIndex];
      const audio = new Audio(src);
      audio.volume = 0.9;

      audio.play().catch(() => {});

      // Trim ONLY the clinks to 1.3s
      if (src.includes("beer-bottle-clinks")) {
        setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
        }, 1300);
      }

      tapSoundIndex = (tapSoundIndex + 1) % tapSounds.length;
    }

    function showMilestoneGif() {
      const gifPath = (milestoneToggle % 2 === 0)
        ? "assets/img/SC-Beers.gif"
        : "assets/img/SC-swim.gif";

      milestoneToggle++;

      milestoneGif.src = gifPath;
      milestoneOverlay.classList.remove("hidden");

      setTimeout(() => {
        milestoneOverlay.classList.add("hidden");
      }, 1400);
    }

    function throwBottleAnimation() {
      const bottle = document.createElement("img");
      bottle.src = "assets/img/MT.jpeg";
      bottle.className = "throwBottle";
      bottle.alt = "Thrown bottle";

      animLayer.appendChild(bottle);
      bottle.addEventListener("animationend", () => bottle.remove());
    }

    function addBeerToPile() {
      const icon = document.createElement("img");
      icon.src = "assets/img/Mug.png";
      icon.className = "beerIcon";
      icon.alt = "Beer";

      beerPile.appendChild(icon);
    }

    // ====== Startup: try to play intro on load
    window.addEventListener("load", () => {
      playIntroOnce();
    });

    // If autoplay is blocked, first interaction will unlock it.
    // We'll play intro once on the first mug tap if needed.
    mugBtn.addEventListener("click", () => {
      // If intro didn't play due to autoplay restrictions, play it now ONCE
      if (!introHasPlayed) {
        playIntroOnce();
      }

      beerCount++;
      countEl.textContent = beerCount;

      playNextTapSound();
      throwBottleAnimation();
      addBeerToPile();

      if (beerCount % 5 === 0) {
        showMilestoneGif();
      }
    });
  </script>
</body>
</html>
