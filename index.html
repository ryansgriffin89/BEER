<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drunk Ryan's Counter</title>

  <style>
    :root{
      --radius: 22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.72);
      --gold: #f7c948;
      --glass: rgba(0,0,0,.40);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color: var(--text);
      background: #0b0d10;
      overflow:hidden;
      touch-action: none;
    }

    /* Background */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(900px 520px at 18% 10%, rgba(247,201,72,.14), transparent 60%),
        radial-gradient(800px 480px at 86% 22%, rgba(255,70,70,.10), transparent 60%),
        linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.80)),
        url("assets/img/Background.png");
      background-size: cover;
      background-position: center;
      filter: saturate(1.08) contrast(1.06);
      transform: scale(1.03);
      z-index: -2;
    }

    .wrap{
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 16px 14px 28px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header{
      flex-shrink: 0;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 14px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .title h1{
      margin:0;
      font-size: 18px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(247,201,72,.28);
    }
    .title p{
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.2;
    }

    .headerBtns{
      display:flex;
      gap: 8px;
      align-items:center;
      margin-left:auto;
    }
    .iconBtn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 12px;
      letter-spacing: .6px;
      text-transform: uppercase;
      cursor:pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .iconBtn:active{ transform: scale(.98); }

    .countBox{ text-align:right; min-width: 120px; }
    #count{
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,201,72,.92));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .countLabel{
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stage{
      position: relative;
      flex-grow: 1;
      margin-top: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .stage::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 32%;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.72));
      pointer-events:none;
    }

    /* Mug button + pour animation layer */
    #mugBtn{
      position:absolute;
      left: 16px;
      top: 34px;
      width: 175px;
      height: 175px;
      cursor: pointer;
      transition: transform 0.08s;
      z-index: 5;
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 24px;
    }
    #mugBtn:active{ transform: scale(0.97); }

    .mugWrap{
      position:relative;
      width:100%;
      height:100%;
    }
    .mugImg{
      position:relative;
      z-index: 3;
      width:100%;
      height:100%;
      object-fit:contain;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.55));
    }

    /* Fake “beer level” overlay */
    .beerFill{
      position:absolute;
      left: 18%;
      width: 64%;
      bottom: 18%;
      height: 52%;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(247,201,72,.65), rgba(255,170,60,.40));
      filter: blur(.1px);
      opacity: 0;
      z-index: 2;
      transform: translateZ(0);
    }
    .beerFill.active{ opacity: .95; }
    .beerFill.drain{
      animation: drain 0.95s ease-in forwards;
    }
    @keyframes drain{
      from{ height: 52%; opacity:.95; }
      70%{ opacity:.95; }
      to{ height: 0%; opacity:.0; }
    }

    .holdHint{
      position:absolute;
      left: 16px;
      top: 220px;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      letter-spacing: .6px;
      text-transform: uppercase;
      z-index: 6;
      user-select:none;
    }

    /* Bottle decoration (optional) */
    #bottleDeco{
      position:absolute;
      left: 205px;
      top: 102px;
      width: 54px;
      height: 150px;
      opacity: .92;
      z-index: 4;
      pointer-events: none;
    }
    #bottleDeco img{
      width:100%; height:100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.55));
    }

    /* Beer pile */
    #beerPile{
      position:absolute;
      left: 12px;
      bottom: 12px;
      width: calc(100% - 24px);
      height: 120px;
      display: flex;
      flex-wrap: wrap-reverse;
      align-content: flex-start;
      gap: 4px;
      z-index: 2;
      pointer-events: none;
    }
    .pileItem{
      width: 30px;
      height: auto;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.65));
      animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn{ from{ transform: scale(0); } to{ transform: scale(1); } }

    /* Toast */
    .toast{
      position:absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(247,201,72,.18);
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.92);
      font-size: 12px;
      letter-spacing: .8px;
      text-transform: uppercase;
      z-index: 40;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s, transform .25s;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(6px);
    }

    /* Overlays */
    .overlay.hidden{ display:none; }
    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,1);
      z-index: 10000;
      padding: 16px;
      transition: opacity 0.5s;
    }
    .overlayGif{
      width: min(520px, 92vw);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .overlayText{
      margin-top: 20px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(247,201,72,0.35);
      text-align: center;
    }
    .tapToStart{
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,.70);
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blink 2s infinite;
    }
    @keyframes blink { 50%{ opacity: 0.55; }}

    /* Modal */
    .modalBackdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.78);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 11000;
    }
    .modalBackdrop.show{ display:flex; }

    .modal{
      width: min(560px, 96vw);
      max-height: 86vh;
      overflow:auto;
      border-radius: 22px;
      border: 1px solid rgba(247,201,72,.20);
      background: linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.62));
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      backdrop-filter: blur(10px);
    }
    .modalHeader{
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
    }
    .modalHeader h2{
      margin:0;
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(247,201,72,.25);
    }
    .closeBtn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 8px 10px;
      cursor:pointer;
      text-transform: uppercase;
      letter-spacing: .8px;
      font-size: 12px;
    }
    .modalBody{ padding: 14px; color: rgba(255,255,255,.92); }

    .statLine{
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
      letter-spacing: .3px;
    }
    .statLine:last-child{ border-bottom:none; }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .badge{
      border-radius: 18px;
      border: 1px solid rgba(247,201,72,.18);
      background: rgba(0,0,0,.35);
      padding: 12px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      position: relative;
      overflow:hidden;
    }
    .badge.locked{ opacity: .55; filter: grayscale(.35); }
    .badgeName{
      font-weight: 900;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      font-size: 12px;
    }
    .badgeReq{
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }
    .badgeDesc{
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      line-height: 1.25;
    }

    /* Reset */
    .resetBtn{
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,0,0,0.16);
      border: 1px solid rgba(255,0,0,0.35);
      color: rgba(255,255,255,.90);
      font-size: 10px;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 30;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 600px){
      #mugBtn{ width: 148px; height: 148px; top: 28px; left: 10px;}
      #bottleDeco{ width: 46px; height: 132px; left: 170px; top: 92px;}
      .title h1{ font-size: 16px; }
      .grid{ grid-template-columns: 1fr; }
      .holdHint{ top: 200px; left: 10px; font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <!-- Startup overlay -->
  <div id="startupOverlay" class="overlay">
    <img src="assets/img/SC-Smile.gif" alt="Stone Cold" class="overlayGif">
    <div class="overlayText">WELCOME TO RYAN'S BAR</div>
    <div class="tapToStart">TAP TO OPEN THE BAR (SOUND ON)</div>
  </div>

  <!-- Milestone overlay -->
  <div id="milestoneOverlay" class="overlay hidden" style="background: rgba(0,0,0,0.88);">
    <img id="milestoneGif" src="" alt="Milestone" class="overlayGif">
    <div class="overlayText" id="milestoneText">HELL YEAH!</div>
  </div>

  <!-- Stats modal -->
  <div id="statsModal" class="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Stats">
      <div class="modalHeader">
        <h2>Stats</h2>
        <button class="closeBtn" data-close="statsModal">Close</button>
      </div>
      <div class="modalBody" id="statsBody"></div>
    </div>
  </div>

  <!-- Badges modal -->
  <div id="badgesModal" class="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Badges">
      <div class="modalHeader">
        <h2>Badges</h2>
        <button class="closeBtn" data-close="badgesModal">Close</button>
      </div>
      <div class="modalBody">
        <div style="font-size:12px; color: rgba(255,255,255,.75); letter-spacing:.8px; text-transform:uppercase;">
          Unlocked: <span id="badgesUnlocked">0</span> / <span id="badgesTotal">0</span>
        </div>
        <div id="badgesGrid" class="grid"></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Drunk Ryan’s Counter</h1>
        <p>Tap = finished beer • Hold = “drain to empty” finish</p>
      </div>

      <div class="headerBtns">
        <button class="iconBtn" id="statsBtn">Stats</button>
        <button class="iconBtn" id="badgesBtn">Badges</button>
      </div>

      <div class="countBox">
        <div id="count">0</div>
        <div class="countLabel">beers</div>
      </div>
    </header>

    <main class="stage" id="stage">
      <div id="toast" class="toast">Saved</div>
      <button class="resetBtn" id="resetBtn">Reset</button>

      <button id="mugBtn" aria-label="Log a finished beer">
        <div class="mugWrap">
          <div id="beerFill" class="beerFill"></div>
          <img class="mugImg" src="assets/img/Mug.png" alt="Mug">
        </div>
      </button>

      <div class="holdHint">Tip: hold the mug to “drain” it</div>

      <div id="bottleDeco" aria-hidden="true">
        <img src="assets/img/MT.jpeg" alt="Bottle">
      </div>

      <div id="beerPile"></div>
    </main>
  </div>

  <script>
    // ----------------------------
    // Storage + Data Model
    // ----------------------------
    const KEY_EVENTS = "drunkRyanEventsV1"; // array of timestamps (ms)
    const KEY_AUDIO_UNLOCKED = "drunkRyanAudioUnlockedV1";

    function loadEvents(){
      try{
        const raw = localStorage.getItem(KEY_EVENTS);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr.filter(n => Number.isFinite(n)) : [];
      }catch(e){
        return [];
      }
    }
    function saveEvents(events){
      localStorage.setItem(KEY_EVENTS, JSON.stringify(events));
    }

    // ----------------------------
    // Elements
    // ----------------------------
    const countEl = document.getElementById("count");
    const beerPile = document.getElementById("beerPile");
    const mugBtn = document.getElementById("mugBtn");
    const beerFill = document.getElementById("beerFill");
    const startupOverlay = document.getElementById("startupOverlay");
    const toastEl = document.getElementById("toast");

    const statsBtn = document.getElementById("statsBtn");
    const badgesBtn = document.getElementById("badgesBtn");
    const statsModal = document.getElementById("statsModal");
    const badgesModal = document.getElementById("badgesModal");
    const statsBody = document.getElementById("statsBody");
    const badgesGrid = document.getElementById("badgesGrid");
    const badgesUnlockedEl = document.getElementById("badgesUnlocked");
    const badgesTotalEl = document.getElementById("badgesTotal");

    // ----------------------------
    // Audio (your exact filenames)
    // ----------------------------
    const INTRO_SRC = "assets/audio/stone-cold-drink-beer.mp3";

    // rotation = everything except intro
    const ROTATION = [
      "assets/audio/beer-bottle-clinks.mp3",
      "assets/audio/Bell.mp3",
      "assets/audio/John-cena.mp3",
      "assets/audio/SCSA-Theme.mp3",
      "assets/audio/Unbelievable.mp3",
      "assets/audio/What.mp3",
      "assets/audio/gay.mp3",
      "assets/audio/kill-tony-meow.mp3",
      "assets/audio/kill-tony-song.mp3",
      "assets/audio/miller-time.mp3"
    ];

    let soundIndex = 0;
    let soundChannel = null;
    let introHasPlayed = false;

    // trim clinks without editing the file
    const CLINKS_MAX_SECONDS = 1.5;

    // mobile unlock helper
    let audioCtx = null;
    async function unlockAudio(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state !== "running") await audioCtx.resume();
      }catch(e){}
      // prime muted playback (some Android builds need it)
      try{
        const a = new Audio();
        a.muted = true;
        await a.play().catch(()=>{});
        a.pause();
        a.muted = false;
      }catch(e){}
    }

    function stopChannel(){
      try{
        if(soundChannel){
          soundChannel.pause();
          soundChannel.currentTime = 0;
        }
      }catch(e){}
      soundChannel = null;
    }

    async function playIntro(){
      if(introHasPlayed) return;
      introHasPlayed = true;

      await unlockAudio();

      const intro = new Audio(encodeURI(INTRO_SRC));
      intro.volume = 1.0;

      // must occur in user gesture; we call this from pointerdown
      intro.play().catch(()=>{});

      startupOverlay.style.opacity = "0";
      setTimeout(() => startupOverlay.classList.add("hidden"), 500);

      // remember we successfully attempted unlock
      localStorage.setItem(KEY_AUDIO_UNLOCKED, "1");
    }

    function ensureStarted(){
      if(!introHasPlayed) playIntro();
    }

    function playRotatingSound(){
      stopChannel();

      const src = ROTATION[soundIndex];
      const a = new Audio(encodeURI(src));
      a.volume = 0.85;

      if(src.includes("beer-bottle-clinks.mp3")){
        const stopper = () => {
          if(a.currentTime >= CLINKS_MAX_SECONDS){
            a.pause();
            a.currentTime = 0;
            a.removeEventListener("timeupdate", stopper);
          }
        };
        a.addEventListener("timeupdate", stopper);
      }

      a.play().catch(()=>{});
      soundChannel = a;

      soundIndex = (soundIndex + 1) % ROTATION.length;
    }

    // ----------------------------
    // UI Helpers
    // ----------------------------
    function vibrate(ms){
      if(navigator.vibrate) navigator.vibrate(ms);
    }

    function showToast(text){
      toastEl.textContent = text;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1200);
    }

    function addPileItem(animate){
      if(beerPile.children.length > 30) return;
      const img = document.createElement("img");
      img.src = "assets/img/Mug.png";
      img.className = "pileItem";
      if(!animate) img.style.animation = "none";
      beerPile.appendChild(img);
    }

    // ----------------------------
    // Stats + Badges
    // ----------------------------
    function startOfDay(d){
      const x = new Date(d);
      x.setHours(0,0,0,0);
      return x;
    }
    function yyyyMmDd(d){
      const x = new Date(d);
      const y = x.getFullYear();
      const m = String(x.getMonth()+1).padStart(2,"0");
      const da = String(x.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }
    function monthKey(d){
      const x = new Date(d);
      const y = x.getFullYear();
      const m = String(x.getMonth()+1).padStart(2,"0");
      return `${y}-${m}`;
    }

    function computeStats(events){
      const total = events.length;
      const now = new Date();

      // MTD
      const thisMonth = monthKey(now);
      const mtd = events.filter(t => monthKey(t) === thisMonth).length;

      // per-day counts
      const byDay = new Map();
      for(const t of events){
        const key = yyyyMmDd(t);
        byDay.set(key, (byDay.get(key) || 0) + 1);
      }

      let highestDay = null, highestCount = 0;
      let lowestDay = null, lowestCount = Infinity;

      for(const [day, c] of byDay.entries()){
        if(c > highestCount){ highestCount = c; highestDay = day; }
        if(c < lowestCount){ lowestCount = c; lowestDay = day; lowestCount = c; }
      }

      // beers per hour (last 4 hours + all-time session-style)
      const FOUR_HOURS_MS = 4 * 3600 * 1000;
      const last4h = events.filter(t => (Date.now() - t) <= FOUR_HOURS_MS).length;
      const bphLast4 = (last4h / 4);

      let bphOverall = 0;
      if(total >= 2){
        const first = events[0];
        const last = events[total-1];
        const hours = Math.max(0.01, (last - first) / 3600000);
        bphOverall = total / hours;
      }

      // “Today”
      const todayKey = yyyyMmDd(now);
      const today = byDay.get(todayKey) || 0;

      return {
        total,
        mtd,
        today,
        highestDay, highestCount,
        lowestDay, lowestCount: (lowestCount === Infinity ? 0 : lowestCount),
        bphLast4,
        bphOverall
      };
    }

    const BADGES = [
      { id:"b1",  req:1,  name:"First Sip", desc:"You logged your first beer." },
      { id:"b5",  req:5,  name:"First Round", desc:"5 logged beers." },
      { id:"b10", req:10, name:"Buzzed", desc:"10 logged beers." },
      { id:"b24", req:24, name:"Case King", desc:"24 logged beers. Absolute legend." },
      { id:"b25", req:25, name:"Stone Cold Certified", desc:"HELL YEAH status." },
      { id:"b50", req:50, name:"Regular", desc:"50 logged beers." },
      { id:"b100",req:100,name:"Bar Fixture", desc:"100 logged beers." }
    ];

    function unlockedBadges(total){
      return new Set(BADGES.filter(b => total >= b.req).map(b => b.id));
    }

    function renderBadges(events){
      const total = events.length;
      const unlocked = unlockedBadges(total);

      badgesUnlockedEl.textContent = String(unlocked.size);
      badgesTotalEl.textContent = String(BADGES.length);
      badgesGrid.innerHTML = "";

      for(const b of BADGES){
        const locked = !unlocked.has(b.id);
        const card = document.createElement("div");
        card.className = "badge" + (locked ? " locked" : "");
        card.innerHTML = `
          <div class="badgeName">${locked ? "???" : b.name}</div>
          <div class="badgeReq">${b.req} beers</div>
          <div class="badgeDesc">${locked ? "Keep logging beers to unlock." : b.desc}</div>
        `;
        badgesGrid.appendChild(card);
      }
    }

    function renderStats(events){
      const s = computeStats(events);

      const lines = [
        `<div class="statLine"><b>Total logged:</b> ${s.total}</div>`,
        `<div class="statLine"><b>Beers today:</b> ${s.today}</div>`,
        `<div class="statLine"><b>Beers MTD:</b> ${s.mtd}</div>`,
        `<div class="statLine"><b>Beers/hr (last 4 hrs):</b> ${s.bphLast4.toFixed(2)}</div>`,
        `<div class="statLine"><b>Beers/hr (overall):</b> ${s.bphOverall.toFixed(2)}</div>`,
        `<div class="statLine"><b>Highest volume day:</b> ${s.highestDay ? `${s.highestDay} (${s.highestCount})` : "—"}</div>`,
        `<div class="statLine"><b>Lowest volume day:</b> ${s.lowestDay ? `${s.lowestDay} (${s.lowestCount})` : "—"}</div>`
      ];

      statsBody.innerHTML = lines.join("");
    }

    // ----------------------------
    // Log events (tap = finished beer)
    // ----------------------------
    let events = loadEvents();
    events.sort((a,b) => a-b);

    function rebuildUI(){
      countEl.textContent = String(events.length);
      beerPile.innerHTML = "";
      const pileCount = Math.min(30, events.length);
      for(let i=0;i<pileCount;i++) addPileItem(false);
    }

    function logBeer(){
      ensureStarted();

      const prevTotal = events.length;

      events.push(Date.now());
      events.sort((a,b)=>a-b);
      saveEvents(events);

      countEl.textContent = String(events.length);
      addPileItem(true);

      // badge toast if newly unlocked
      const newlyUnlocked = BADGES.find(b => prevTotal < b.req && events.length >= b.req);
      if(newlyUnlocked){
        showToast(`Unlocked: ${newlyUnlocked.name}`);
        vibrate(60);
      } else {
        showToast("Logged");
        vibrate(18);
      }

      playRotatingSound();
      checkMilestone(events.length);
    }

    function checkMilestone(total){
      if(total > 0 && total % 5 === 0){
        const ov = document.getElementById("milestoneOverlay");
        const gif = document.getElementById("milestoneGif");
        const txt = document.getElementById("milestoneText");

        const big = (total % 10 === 0);
        gif.src = big ? "assets/img/SC-Beers.gif" : "assets/img/SC-swim.gif";
        txt.textContent = big ? "HELL YEAH!" : "CHEERS!";

        ov.classList.remove("hidden");
        setTimeout(() => ov.classList.add("hidden"), 2000);
      }
    }

    // ----------------------------
    // Tap vs Long-Press (drain animation)
    // ----------------------------
    let pressTimer = null;
    let longPressTriggered = false;
    const LONG_PRESS_MS = 450;

    function startPress(e){
      ensureStarted();
      longPressTriggered = false;

      // show fill quickly so it looks like a “full beer” before draining
      beerFill.classList.add("active");
      beerFill.classList.remove("drain");

      pressTimer = setTimeout(() => {
        longPressTriggered = true;

        // drain animation
        beerFill.classList.add("drain");

        // log at end of drain (represents finishing the beer)
        setTimeout(() => {
          beerFill.classList.remove("active");
          beerFill.classList.remove("drain");
          logBeer();
        }, 950);

      }, LONG_PRESS_MS);
    }

    function endPress(){
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer = null;
      }

      if(!longPressTriggered){
        // short tap = finish beer immediately (no drain)
        beerFill.classList.remove("active");
        beerFill.classList.remove("drain");
        logBeer();
      }
      // if long press triggered, log happens at end of drain
    }

    mugBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); startPress(e); }, { passive:false });
    mugBtn.addEventListener("pointerup", (e) => { e.preventDefault(); endPress(); }, { passive:false });
    mugBtn.addEventListener("pointercancel", endPress);
    mugBtn.addEventListener("pointerleave", () => {
      // if finger slides off, treat like release
      if(pressTimer || longPressTriggered) endPress();
    });

    // ----------------------------
    // Intro overlay (reliable mobile)
    // ----------------------------
    startupOverlay.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      playIntro();
    }, { passive:false });

    // ----------------------------
    // Modals
    // ----------------------------
    function openModal(el){
      el.classList.add("show");
      el.setAttribute("aria-hidden","false");
    }
    function closeModal(el){
      el.classList.remove("show");
      el.setAttribute("aria-hidden","true");
    }

    [statsModal, badgesModal].forEach(backdrop => {
      backdrop.addEventListener("click", (e) => {
        if(e.target === backdrop) closeModal(backdrop);
      });
    });

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        closeModal(document.getElementById(btn.getAttribute("data-close")));
      });
    });

    statsBtn.addEventListener("click", () => {
      renderStats(events);
      openModal(statsModal);
    });

    badgesBtn.addEventListener("click", () => {
      renderBadges(events);
      openModal(badgesModal);
    });

    // ----------------------------
    // Reset (clears history + stats)
    // ----------------------------
    document.getElementById("resetBtn").addEventListener("click", () => {
      if(confirm("Clear ALL history (timestamps + stats)?")){
        events = [];
        saveEvents(events);
        rebuildUI();
        showToast("Reset");
        vibrate(30);
      }
    });

    // ----------------------------
    // Init
    // ----------------------------
    rebuildUI();
  </script>
</body>
  </html>
