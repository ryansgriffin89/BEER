<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drunk Ryan's Counter</title>

  <style>
    :root{
      --radius: 22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glass: rgba(0,0,0,.35);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.72);
      --gold: #f7c948;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color: var(--text);
      background: #0b0d10;
      overflow:hidden;
      touch-action: none;
    }

    /* Background image */
    .bg{
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.72)),
        url("assets/img/Background.png");
      background-size: cover;
      background-position: center;
      filter: saturate(1.1) contrast(1.05);
      transform: scale(1.02);
      z-index: -2;
    }

    .wrap{
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 16px 14px 28px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header{
      flex-shrink: 0;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      padding: 14px 14px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(0,0,0,.35);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .title h1{
      margin:0;
      font-size: 18px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .title p{
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .countBox{ text-align:right; min-width: 110px; }
    #count{
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,201,72,.9));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .countLabel{
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Main Stage */
    .stage{
      position: relative;
      flex-grow: 1;
      margin-top: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Floor Fade */
    .stage::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 30%;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.62));
      pointer-events:none;
    }

    /* --- Interactive Elements --- */

    /* The Mug (Tap Only) */
    #mugBtn{
      position:absolute;
      left: 20px;
      top: 40px;
      width: 160px;
      height: 160px;
      cursor: pointer;
      transition: transform 0.1s;
      z-index: 5;
    }
    #mugBtn img{ width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5)); }
    #mugBtn:active{ transform: scale(0.95); }

    .tapLabel{
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      color: white;
      pointer-events: none;
    }

    /* The Bottle (Draggable) */
    #bottleDrag{
      position: absolute;
      left: 170px;
      top: 100px;
      width: 50px;
      height: 140px;
      cursor: grab;
      z-index: 6;
      touch-action: none;
      transition: transform 0.2s;
    }
    #bottleDrag img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
      pointer-events: none;
    }
    #bottleDrag.is-dragging{
      cursor: grabbing;
      opacity: 0.8;
      transform: scale(1.1);
      transition: none;
      z-index: 999;
    }
    .dragLabel{
      position: absolute;
      top: -25px;
      left: 50%;
      width: 100px;
      text-align: center;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--muted);
      opacity: 0.6;
      pointer-events: none;
    }

    /* The Trash Can */
    #trashZone{
      position:absolute;
      right: 20px;
      bottom: 20px;
      width: 140px;
      height: 160px;
      z-index: 4;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #trashZone img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 20px rgba(0,0,0,0.6));
    }
    #trashZone.hovered{
      transform: scale(1.15) rotate(-5deg);
      filter: brightness(1.2);
    }

    /* Beer Pile */
    #beerPile{
      position:absolute;
      left: 14px;
      bottom: 14px;
      width: calc(100% - 180px);
      height: 100px;
      display: flex;
      flex-wrap: wrap-reverse;
      align-content: flex-start;
      gap: 4px;
      z-index: 2;
      pointer-events: none;
    }
    .pileItem{
      width: 30px;
      height: auto;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6));
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn{ from{ transform: scale(0); } to{ transform: scale(1); } }

    /* --- Overlays --- */
    .overlay.hidden{ display:none; }
    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,1); /* Solid black for intro */
      z-index: 10000;
      padding: 16px;
      transition: opacity 0.5s;
    }
    .overlayGif{
      width: min(520px, 92vw);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .overlayText{
      margin-top: 20px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(247,201,72,0.4);
      text-align: center;
    }
    .tapToStart{
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      animation: blink 2s infinite;
    }
    @keyframes blink { 50%{ opacity: 0.5; }}

    /* Reset button */
    .resetBtn{
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,0,0,0.2);
      border: 1px solid rgba(255,0,0,0.4);
      color: #ffcccc;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 30;
    }

    @media (max-width: 600px){
      #mugBtn{ width: 130px; height: 130px; top: 30px; left: 10px;}
      #bottleDrag{ width: 45px; height: 120px; left: 150px; top: 80px;}
      #trashZone{ width: 110px; height: 130px; bottom: 10px; right: 10px; }
      .title h1{ font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div id="startupOverlay" class="overlay">
    <img src="assets/img/SC-Smile.gif" alt="Stone Cold" class="overlayGif">
    <div class="overlayText">WELCOME TO RYAN'S BAR</div>
    <div class="tapToStart">TAP SCREEN TO START</div>
  </div>

  <div id="milestoneOverlay" class="overlay hidden" style="background: rgba(0,0,0,0.85);">
    <img id="milestoneGif" src="" alt="Milestone" class="overlayGif">
    <div class="overlayText" id="milestoneText">HELL YEAH!</div>
  </div>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Drunk Ryan’s Counter</h1>
        <p>Tap the mug or Drag the bottle.</p>
      </div>
      <div class="countBox">
        <div id="count">0</div>
        <div class="countLabel">beers</div>
      </div>
    </header>

    <main class="stage" id="stage">
      <button class="resetBtn" id="resetBtn">RESET TAB</button>

      <div id="mugBtn">
        <img src="assets/img/Mug.png" alt="Mug">
        <div class="tapLabel">TAP ME</div>
      </div>

      <div id="bottleDrag">
        <div class="dragLabel">DRAG ME</div>
        <img src="assets/img/MT.jpeg" alt="Bottle">
      </div>

      <div id="trashZone">
        <img src="assets/img/Trash-can.png" alt="Trash">
      </div>

      <div id="beerPile"></div>
    </main>
  </div>

  <script>
    // --- Elements ---
    const countEl = document.getElementById("count");
    const mugBtn = document.getElementById("mugBtn");
    const bottleDrag = document.getElementById("bottleDrag");
    const trashZone = document.getElementById("trashZone");
    const beerPile = document.getElementById("beerPile");
    const stage = document.getElementById("stage");
    const startupOverlay = document.getElementById("startupOverlay");
    
    // --- Audio Setup ---
    const introAudio = new Audio("assets/audio/stone-cold-drink-beer.mp3");
    introAudio.volume = 1.0;
    
    // Removed "Merica.mp3"
    const tapSounds = [
      "assets/audio/beer-bottle-clinks.mp3",
      "assets/audio/Bell.mp3", 
      "assets/audio/SCSA Theme.mp3",
      "assets/audio/Unbelievable.mp3",
      "assets/audio/What.mp3"
    ];
    let soundIndex = 0;

    // --- State ---
    let count = 0;
    let introHasPlayed = false;

    // --- Initialization ---
    function loadState() {
      const saved = localStorage.getItem('drunkRyanCount');
      if(saved) {
        count = parseInt(saved, 10);
        countEl.innerText = count;
        // Rebuild visual pile
        for(let i=0; i<count; i++) addPileItem(false); 
      }
    }
    loadState();

    // --- Intro Logic ---
    // Browsers block auto-audio. We must wait for interaction.
    function startExperience() {
      if(introHasPlayed) return;
      introHasPlayed = true;
      
      introAudio.play().catch(e => console.log("Audio block", e));
      
      // Keep overlay for 2.2s while audio plays
      setTimeout(() => {
        startupOverlay.style.opacity = '0';
        setTimeout(() => startupOverlay.classList.add('hidden'), 500);
      }, 2200);
    }

    // Listen for first interaction anywhere to start audio
    startupOverlay.addEventListener('click', startExperience);
    startupOverlay.addEventListener('touchstart', startExperience);


    // --- Core Logic ---
    function increment(source) {
      count++;
      countEl.innerText = count;
      localStorage.setItem('drunkRyanCount', count);
      
      playRandomSound();
      addPileItem(true);
      checkMilestone();
    }

    function addPileItem(animate) {
      if(beerPile.children.length > 30) return; 
      const img = document.createElement('img');
      img.src = 'assets/img/Mug.png';
      img.className = 'pileItem';
      if(!animate) img.style.animation = 'none';
      beerPile.appendChild(img);
    }

    function playRandomSound() {
      const s = new Audio(tapSounds[soundIndex]);
      s.volume = 0.8;
      s.play().catch(()=>{});
      soundIndex = (soundIndex + 1) % tapSounds.length;
    }

    function checkMilestone() {
      if(count > 0 && count % 5 === 0) {
        const ov = document.getElementById('milestoneOverlay');
        const gif = document.getElementById('milestoneGif');
        gif.src = (count % 10 === 0) ? "assets/img/SC-Beers.gif" : "assets/img/SC-swim.gif";
        ov.classList.remove('hidden');
        setTimeout(() => ov.classList.add('hidden'), 2000);
      }
    }

    // --- DRAG AND DROP LOGIC (Touch + Mouse) ---
    let isDragging = false;
    let startX, startY;

    const getClientCoords = (e) => {
      return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
    }

    const startDrag = (e) => {
      if(e.type === 'mousedown') e.preventDefault();
      isDragging = true;
      const coords = getClientCoords(e);
      startX = coords.x;
      startY = coords.y;
      bottleDrag.classList.add('is-dragging');
    };

    const moveDrag = (e) => {
      if(!isDragging) return;
      const coords = getClientCoords(e);
      const dx = coords.x - startX;
      const dy = coords.y - startY;

      bottleDrag.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;

      const bottleRect = bottleDrag.getBoundingClientRect();
      const trashRect = trashZone.getBoundingClientRect();

      if(
        bottleRect.left < trashRect.right &&
        bottleRect.right > trashRect.left &&
        bottleRect.top < trashRect.bottom &&
        bottleRect.bottom > trashRect.top
      ) {
        trashZone.classList.add('hovered');
      } else {
        trashZone.classList.remove('hovered');
      }
    };

    const endDrag = (e) => {
      if(!isDragging) return;
      isDragging = false;
      bottleDrag.classList.remove('is-dragging');
      
      if(trashZone.classList.contains('hovered')) {
        increment('drag');
        trashZone.classList.remove('hovered');
        bottleDrag.style.transform = `translate(0px, 0px)`; 
      } else {
        bottleDrag.style.transform = `translate(0px, 0px)`; 
      }
    };

    bottleDrag.addEventListener('mousedown', startDrag);
    bottleDrag.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, {passive: false});
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    // Tap Listener
    mugBtn.addEventListener('click', () => increment('tap'));

    // Reset Listener
    document.getElementById('resetBtn').addEventListener('click', () => {
      if(confirm("Empty the tab?")) {
        count = 0;
        countEl.innerText = 0;
        beerPile.innerHTML = '';
        localStorage.setItem('drunkRyanCount', 0);
      }
    });
  </script>
</body>
</html>
