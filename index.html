<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drunk Ryan's Counter</title>
  <style>
    :root {
      --radius: 22px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --glass: rgba(0,0,0,.42);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,0.70);
      --gold: #f7c948;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background: #0b0d10;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* --- Background --- */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(900px 520px at 16% 10%, rgba(247,201,72,.12), transparent 60%),
        radial-gradient(900px 520px at 88% 22%, rgba(255,90,90,.10), transparent 60%),
        linear-gradient(rgba(0,0,0,.56), rgba(0,0,0,.80)),
        url("assets/img/Background.png");
      background-size: cover;
      background-position: center;
      filter: saturate(1.08) contrast(1.06);
      transform: scale(1.02);
      z-index: -2;
    }

    .wrap {
      width: min(600px, 100%);
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* --- Header (Stats & Badges) --- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .btn {
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.3);
      color: rgba(255,255,255,.9);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(.95); }

    /* --- Main Counter --- */
    .counter-display {
      text-align: center;
      margin-top: 10px;
      z-index: 5;
    }
    .counter-display h1 {
      margin: 0;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      text-shadow: 0 0 10px rgba(247,201,72,0.3);
    }
    #count {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      margin: 0;
      background: linear-gradient(180deg, #fff, #ddd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* --- The Stage (Mug Area) --- */
    .stage {
      flex-grow: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Mug Button */
    #mugBtn {
      position: relative;
      width: 220px;
      height: 220px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 7;
      border-radius: 30px;
      -webkit-user-select: none;
      user-select: none;
      transition: transform 0.1s;
    }
    #mugBtn:active { transform: scale(0.96); }

    .mugWrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Mask for Liquid */
    #beerMask {
      position: absolute;
      /* Adjusted to fit generic mug shapes better */
      left: 20%; 
      right: 15%;
      bottom: 12%; 
      height: 60%;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      z-index: 2;
      opacity: 0; /* Hidden by default */
      transition: opacity 0.15s;
    }

    #beerLiquid {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%; /* Animates to 0% */
      background: linear-gradient(180deg, rgba(255,220,140,0.96), rgba(255,170,60,0.96));
      box-shadow: inset 0 0 20px rgba(255,140,0,0.5);
      transition: height 0.9s ease-in;
    }
    /* Bubbles */
    #beerLiquid::after {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 15px 15px;
      animation: bubbles 2s linear infinite;
    }
    @keyframes bubbles { from { background-position: 0 0; } to { background-position: 0 -20px; } }

    .mugImg {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    /* Trash Can (Reset) */
    .trash-container {
      position: absolute;
      bottom: 120px; /* Above pile */
      right: 20px;
      width: 70px;
      height: 80px;
      opacity: 0.7;
      transition: all 0.2s;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .trash-container img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }
    .trash-label {
      font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;
      margin-top: 4px;
    }
    .trash-container:active { transform: scale(0.9); opacity: 1; }

    /* Hint Text */
    #hint {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      pointer-events: none;
      text-align: center;
      width: 100%;
    }
    #hint.hidden { display: none; }

    /* Beer Pile */
    #beerPile {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      padding: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap-reverse;
      gap: -5px; /* Slight overlap */
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
    }
    .pileItem {
      width: 35px;
      height: 35px;
      object-fit: contain;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.7));
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn{ from{ transform: scale(0) translateY(20px); } to{ transform: scale(1) translateY(0); } }

    /* --- Animations --- */
    .shake { animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .tipsy { animation: sway 5s ease-in-out infinite; }
    .wasted { animation: sway 3s ease-in-out infinite; filter: blur(0.4px); }
    @keyframes sway {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(1deg); }
      75% { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }

    /* --- Overlays & Modals --- */
    .overlay.hidden { display: none; }
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; z-index: 10000; transition: opacity 0.5s;
    }
    .overlayGif {
      width: min(500px, 90vw);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .overlayText {
      margin-top: 20px; font-size: 24px; font-weight: 900; color: var(--gold);
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(247,201,72,0.5);
    }
    .tapToStart {
      margin-top: 20px; font-size: 12px; color: #888; letter-spacing: 1px;
      animation: blink 2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; }}

    /* Modals */
    .modalBackdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 11000;
    }
    .modalBackdrop.show { display: flex; }
    .modal {
      width: min(500px, 90vw); max-height: 80vh; overflow-y: auto;
      background: #111; border: 1px solid #333; border-radius: 16px;
      box-shadow: 0 20px 50px #000;
    }
    .modalHeader {
      padding: 16px; border-bottom: 1px solid #222;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modalHeader h2 { margin: 0; color: var(--gold); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .closeBtn {
      background: #222; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer;
    }
    .modalBody { padding: 16px; color: #ddd; font-size: 13px; }
    .statLine { padding: 8px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
    .badgeGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .badge { background: #1a1a1a; padding: 12px; border-radius: 12px; border: 1px solid #333; }
    .badge.locked { opacity: 0.4; filter: grayscale(1); }
    .badgeName { color: var(--gold); font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .badgeDesc { font-size: 11px; color: #888; margin-top: 4px; }

    /* Toast */
    .toast {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); color: var(--gold); padding: 10px 20px;
      border-radius: 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      pointer-events: none; opacity: 0; transition: 0.3s; z-index: 100; border: 1px solid rgba(247,201,72,0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

  </style>
</head>
<body>

  <div class="bg"></div>

  <div id="startupOverlay" class="overlay">
    <img src="assets/img/SC-Smile.gif" alt="Stone Cold" class="overlayGif">
    <div class="overlayText"> Time to drink BAER bo!</div>
    <div class="tapToStart">TAP ANYWHERE TO START</div>
  </div>

  <div id="milestoneOverlay" class="overlay hidden" style="background: rgba(0,0,0,0.9);">
    <img id="milestoneGif" src="" alt="Milestone" class="overlayGif">
    <div class="overlayText" id="milestoneText">HELL YEAH!</div>
  </div>

  <div id="statsModal" class="modalBackdrop">
    <div class="modal">
      <div class="modalHeader"><h2>Stats</h2><button class="closeBtn" data-close="statsModal">CLOSE</button></div>
      <div class="modalBody" id="statsBody"></div>
    </div>
  </div>
  <div id="badgesModal" class="modalBackdrop">
    <div class="modal">
      <div class="modalHeader"><h2>Badges</h2><button class="closeBtn" data-close="badgesModal">CLOSE</button></div>
      <div class="modalBody" id="badgesGrid" class="badgeGrid"></div>
    </div>
  </div>

  <div class="wrap" id="mainWrap">
    
    <div class="header-bar">
      <button class="btn" id="statsBtn">Stats</button>
      <button class="btn" id="badgesBtn">Badges</button>
    </div>

    <div class="counter-display">
      <h1>BEERS DRUNK</h1>
      <div id="count">0</div>
    </div>

    <div class="stage">
      <div id="toast" class="toast">Saved</div>
      
      <button id="mugBtn">
        <div class="mugWrap">
          <div id="beerMask"><div id="beerLiquid"></div></div>
          <img class="mugImg" src="assets/img/Mug.png" alt="Mug">
        </div>
      </button>

      <div id="hint">Hold mug to drain • Tap to log</div>
      
      <div class="trash-container" id="trashBtn">
        <img src="assets/img/Trash-can.png" alt="Trash">
        <span class="trash-label">Reset</span>
      </div>
    </div>

    <div id="beerPile"></div>

  </div>

<script>
  // --- Constants ---
  const KEY_EVENTS = "drunkRyanEventsV4";
  const KEY_HINT = "drunkRyanHintV4";
  const KEY_SOUND = "drunkRyanSoundV4";

  // --- Audio Playlist (MATCHED TO YOUR REPO SCREENSHOT) ---
  const INTRO_SRC = "assets/audio/stone-cold-drink-beer.mp3";
  const PLAYLIST = [
    "assets/audio/beer-bottle-clinks.mp3",
    "assets/audio/Bell.mp3",
    "assets/audio/SCSA-Theme.mp3",  // Fixed hyphen
    "assets/audio/Unbelievable.mp3",
    "assets/audio/What.mp3",
    "assets/audio/John-cena.mp3",   // Added
    "assets/audio/kill-tony-meow.mp3", // Added
    "assets/audio/kill-tony-song.mp3", // Added
    "assets/audio/miller-time.mp3"
  ];
  
  let soundIndex = parseInt(localStorage.getItem(KEY_SOUND) || "0");
  let audioCtx = null;

  // --- Elements ---
  const els = {
    count: document.getElementById("count"),
    pile: document.getElementById("beerPile"),
    mug: document.getElementById("mugBtn"),
    liquid: document.getElementById("beerLiquid"),
    mask: document.getElementById("beerMask"),
    toast: document.getElementById("toast"),
    hint: document.getElementById("hint"),
    trash: document.getElementById("trashBtn"),
    wrap: document.getElementById("mainWrap"),
    intro: document.getElementById("startupOverlay"),
    milestone: document.getElementById("milestoneOverlay"),
    milestoneGif: document.getElementById("milestoneGif"),
    statsBody: document.getElementById("statsBody"),
    badgesGrid: document.getElementById("badgesGrid")
  };

  // --- State ---
  let events = [];
  try { events = JSON.parse(localStorage.getItem(KEY_EVENTS) || "[]"); } catch(e){}

  // --- Init ---
  updateUI();
  
  if(localStorage.getItem(KEY_HINT) === "1") els.hint.classList.add("hidden");

  // --- Functions ---
  function save() {
    localStorage.setItem(KEY_EVENTS, JSON.stringify(events));
    updateUI();
  }

  function updateUI() {
    els.count.textContent = events.length;
    
    // Pile
    els.pile.innerHTML = "";
    const showCount = Math.min(events.length, 30);
    for(let i=0; i<showCount; i++) {
      const img = document.createElement("img");
      img.src = "assets/img/Mug.png";
      img.className = "pileItem";
      els.pile.appendChild(img);
    }

    // Drunk Effect
    document.body.className = "";
    if(events.length >= 10) document.body.className = "wasted";
    else if(events.length >= 5) document.body.className = "tipsy";
  }

  function playSound() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const src = PLAYLIST[soundIndex % PLAYLIST.length];
    const audio = new Audio(src);
    audio.volume = 0.9;
    
    // Trim clinks
    if(src.includes("beer-bottle-clinks")) {
        setTimeout(() => audio.pause(), 1400);
    }
    
    audio.play().catch(e => console.log("Audio block", e));
    
    soundIndex++;
    localStorage.setItem(KEY_SOUND, soundIndex);
  }

  function logBeer() {
    events.push(Date.now());
    save();
    playSound();
    
    // Visuals
    els.toast.classList.add("show");
    setTimeout(() => els.toast.classList.remove("show"), 1500);
    
    // Shake
    els.wrap.classList.remove("shake");
    void els.wrap.offsetWidth;
    els.wrap.classList.add("shake");

    // Hide hint
    if(localStorage.getItem(KEY_HINT) !== "1") {
        localStorage.setItem(KEY_HINT, "1");
        els.hint.classList.add("hidden");
    }

    // Milestone
    if(events.length > 0 && events.length % 5 === 0) {
        const isBig = events.length % 10 === 0;
        els.milestoneGif.src = isBig ? "assets/img/SC-Beers.gif" : "assets/img/SC-swim.gif";
        els.milestone.classList.remove("hidden");
        setTimeout(() => els.milestone.classList.add("hidden"), 2200);
    }
  }

  // --- Tap/Hold Logic ---
  let holdTimer = null;
  let isDraining = false;

  function startHold() {
    isDraining = false;
    els.liquid.style.transition = "none";
    els.liquid.style.height = "100%";
    els.mask.style.opacity = "1";

    holdTimer = setTimeout(() => {
        isDraining = true;
        els.liquid.style.transition = "height 0.9s ease-in";
        els.liquid.style.height = "0%";
        setTimeout(() => {
            logBeer();
            resetVisuals();
        }, 900);
    }, 300);
  }

  function endHold() {
    clearTimeout(holdTimer);
    if(!isDraining) {
        logBeer();
        resetVisuals();
    }
  }

  function resetVisuals() {
    els.mask.style.opacity = "0";
    els.liquid.style.height = "100%";
  }

  els.mug.addEventListener("mousedown", startHold);
  els.mug.addEventListener("touchstart", (e) => { e.preventDefault(); startHold(); });
  els.mug.addEventListener("mouseup", endHold);
  els.mug.addEventListener("touchend", (e) => { e.preventDefault(); endHold(); });

  // --- Reset ---
  els.trash.addEventListener("click", () => {
    if(confirm("Empty the tab? This deletes all stats.")) {
        events = [];
        save();
    }
  });

  // --- Intro ---
  els.intro.addEventListener("click", () => {
    const a = new Audio(INTRO_SRC);
    a.play().catch(()=>{});
    els.intro.style.opacity = "0";
    setTimeout(() => els.intro.classList.add("hidden"), 500);
  });

  // --- Stats/Badges Modals ---
  const BADGES = [
    {req:1, name:"First Sip", desc:"Logged 1 beer"},
    {req:5, name:"Warm Up", desc:"Logged 5 beers"},
    {req:10, name:"Buzzin", desc:"Logged 10 beers"},
    {req:24, name:"Case King", desc:"Logged 24 beers"},
    {req:50, name:"Legend", desc:"Logged 50 beers"}
  ];

  document.getElementById("statsBtn").addEventListener("click", () => {
    document.getElementById("statsModal").classList.add("show");
    // Simple Stats Render
    let today = 0;
    const nowStr = new Date().toDateString();
    events.forEach(t => { if(new Date(t).toDateString() === nowStr) today++; });
    els.statsBody.innerHTML = `
        <div class="statLine"><span>Total</span> <span>${events.length}</span></div>
        <div class="statLine"><span>Today</span> <span>${today}</span></div>
    `;
  });

  document.getElementById("badgesBtn").addEventListener("click", () => {
    document.getElementById("badgesModal").classList.add("show");
    els.badgesGrid.innerHTML = "";
    BADGES.forEach(b => {
        const locked = events.length < b.req;
        els.badgesGrid.innerHTML += `
            <div class="badge ${locked ? 'locked' : ''}">
                <div class="badgeName">${b.name}</div>
                <div class="badgeDesc">${locked ? 'Locked' : b.desc}</div>
            </div>
        `;
    });
  });

  document.querySelectorAll(".closeBtn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".modalBackdrop").forEach(m => m.classList.remove("show"));
    });
  });

</script>
</body>
</html>
